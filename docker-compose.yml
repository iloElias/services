services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "6432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    networks:
      - global-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    mem_limit: 1g

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped

    env_file:
      - .env

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - global-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    mem_limit: 1g

  rabbitmq:
    image: rabbitmq:4.3.4-management
    hostname: rabbitmq
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    ports:
      - "15672:15672"

    networks:
      - global-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    mem_limit: 1g

  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    networks:
      - global-network

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 30s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    mem_limit: 1g

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped

    env_file:
      - .env

    command: >
      server /data
      --address ":9100"
      --console-address ":9101"

    volumes:
      - minio-data:/data

    networks:
      - global-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    mem_limit: 1g

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.12
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - rustfs-data:/data

    networks:
      - global-network

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s

    mem_limit: 1g

volumes:
  minio-data:
  rabbitmq-data:
  rustfs-data:
  postgres-data:
  redis-data:

networks:
  global-network:
    external: true
